{% extends 'layout.html' %}
{% block content %}
<h2>食品編集</h2>
<form method="POST" enctype="multipart/form-data">
    <div class="form-group">
        <label>食品名</label>
        <input type="text" name="name" class="form-control" value="{{ food.name }}" required>
    </div>
    <div class="form-group">
        <label>数量</label>
        <input type="text" name="quantity" class="form-control" value="{{ food.quantity }}" required>
    </div>
    <div class="form-group">
        <label>賞味期限</label>
        <input type="date" name="expiry_date" class="form-control" value="{{ food.expiry_date }}" required>
    </div>
    <div class="form-group">
        <label for="tags">タグ（カンマ区切り）</label>
        <input type="text" class="form-control" name="tags" id="tags" placeholder="例: 冷凍, 野菜">
    </div>
    <div class="form-group">
        <form method="POST" enctype="multipart/form-data">
            <label>画像</label>
            {% if food.image_path %}
            <div><img src="{{ url_for('static', filename='images/' + food.image_path.split('/')[-1]) }}"
                    style="max-height:100px;"></div>
            {% endif %}
            <input type="file" name="image" class="form-control-file" accept="image/*" capture="user">
            <small class="form-text text-muted">新しい画像を選ぶと上書きされます</small>
    </div>
    <button type="submit" class="btn btn-primary">更新</button>
</form>
{% endblock %}
